name: Bug report
description: Report a reproducible problem in @lynxland/uikit
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please include a minimal reproduction and exact versions.
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: A repo/codesandbox or the smallest code that shows the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the full error/stack and command output.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: @lynxland/uikit version
      placeholder: 3.0.0
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: React/Node/TanStack/Base UI/shadcn versions, browser, package manager.
    validations:
      required: true
